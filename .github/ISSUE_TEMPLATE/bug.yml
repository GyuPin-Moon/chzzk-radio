name: 문제 알리기
description: 기능이 동작하지 않거나 이상하게 동작할 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **개발자 도구의 네트워크·쿠키 화면은 올리지 마세요.** `NID_AUT`, `NID_SES` 같은 값이 보이면 그것만으로 네이버 계정에 로그인할 수 있습니다.
        보안 문제는 이 양식 대신 Security 탭의 **Report a vulnerability**로 알려 주세요.
  - type: checkboxes
    id: privacy
    attributes:
      label: 확인
      options:
        - label: 첨부한 글과 이미지에 로그인 쿠키나 토큰이 없습니다.
          required: true
  - type: input
    id: version
    attributes:
      label: 확장 프로그램 버전
      description: "`chrome://extensions`의 치지직 라디오 카드에 적힌 버전"
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 브라우저
      options: [Chrome, Edge, Whale, Aside, 기타]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 무엇을 눌렀고, 어떻게 되기를 기대했고, 실제로는 어떻게 됐는지
    validations:
      required: true
  - type: input
    id: message
    attributes:
      label: 팝업에 뜬 문구
      description: 빨간 글씨로 뜬 오류 문구가 있으면 그대로 적어 주세요.
